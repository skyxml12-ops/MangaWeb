
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MangaWeb</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px;
      background: #191923;
      border-bottom: 2px solid #8b5cf6;
    }
    h1 { margin: 0; color: #a78bfa; }
    .container { padding: 20px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #22222c;
      color: white;
      margin: 15px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
    }
    .card {
      background: #20202a;
      border-radius: 12px;
      overflow: hidden;
      padding-bottom: 12px;
    }
    .cover {
      height: 170px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #6d28d9, #111827);
      font-size: 42px;
    }
    .card h3, .card p { margin: 10px; }
    .exclusive { color: #fbbf24; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>📚 MangaWeb</h1>
    <p>Dunia manga favoritmu.</p>
  </header>

  <main class="container">
    <h2>Katalog Manga</h2>
    <input id="search" placeholder="Cari judul manga..."
      oninput="cariManga()">

    <div class="grid" id="katalog">
      <div class="card" data-title="shadow legend">
        <div class="cover">⚔️</div>
        <h3>Shadow Legend</h3>
        <p>Action · Fantasy</p>
      </div>
      <div class="card" data-title="cosmic warrior">
        <div class="cover">🌌</div>
        <h3>Cosmic Warrior</h3>
        <p>Adventure · Sci-Fi</p>
      </div>
      <div class="card" data-title="secret universe">
        <div class="cover">🔒</div>
        <h3>Secret Universe</h3>
        <p class="exclusive">🔐 EXCLUSIVE</p>
      </div>
    </div>
  </main>

  <script>
    function cariManga() {
      const q = document.getElementById("search")
        .value.toLowerCase();
      document.querySelectorAll(".card").forEach(card => {
        card.style.display =
          card.dataset.title.includes(q) ? "" : "none";
      });
    }
  </script>
</body>
</html>
